<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#060706" />
  <title>THEARD — Redirecting</title>
  <script>
    (function () {
      var path = window.location.pathname;
      var suffix = window.location.search + window.location.hash;

      if (path.indexOf('/theard/site/draw') === 0 || path === '/theard/draw') {
        window.location.replace('/theard/draw/' + suffix);
        return;
      }

      if (path.indexOf('/theard/site') === 0 || path.indexOf('/theard/404') === 0) {
        window.location.replace('/theard/' + suffix);
      }
    })();
  </script>
  <style>
    html,body{margin:0;width:100%;height:100%;background:#060706;color:#d9ff3f;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
    body{display:grid;place-items:center}
    main{display:grid;gap:18px;text-align:center}
    a{color:inherit;text-decoration:none;border-bottom:1px solid currentColor;padding-bottom:4px}
  </style>
</head>
<body>
  <main>
    <a href="/theard/">ENTER THEARD →</a>
    <a href="/theard/draw/">OPEN PASS DRAW →</a>
  </main>
</body>
</html>
