name: Deploy showcase to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify isolated entrances
        shell: bash
        run: |
          set -euo pipefail
          test -f site/index.html
          test -f site/styles.css
          test -f site/app.js
          test -f site/activity.js
          test -f site/matter.js
          test -f site/trend.js
          test -f site/trend.css
          test -f site/pass-sync.js
          test -f site/pass-sync.css
          test -f site/api.js
          test -f site/ticket.html
          test -f site/ticket.js
          test -f site/verify.html
          test -f site/data/trend-article.json
          test -f site/trend/index.html
          test -f site/trend/styles.css
          test -f site/trend/app.js
          test -f site/draw/index.html
          test -f site/draw/styles.css
          test -f site/draw/access.css
          test -f site/draw/app.js
          test -f site/draw/pets.js
          test -f site/draw/rarity.css
          test -f site/admin/index.html
          test -f site/admin/styles.css
          test -f site/admin/sync.css
          test -f site/admin/app.js
          test -f site/workshop/index.html
          test -f site/workshop/styles.css
          test -f site/workshop/app.js

          python - <<'PY'
          from pathlib import Path

          main = Path('site/index.html').read_text(encoding='utf-8')
          main_app = Path('site/app.js').read_text(encoding='utf-8')
          activity_app = Path('site/activity.js').read_text(encoding='utf-8')
          trend_module = Path('site/trend.js').read_text(encoding='utf-8')
          pass_sync = Path('site/pass-sync.js').read_text(encoding='utf-8')
          analyzer = Path('site/trend/index.html').read_text(encoding='utf-8')
          analyzer_app = Path('site/trend/app.js').read_text(encoding='utf-8')
          draw = Path('site/draw/index.html').read_text(encoding='utf-8')
          draw_app = Path('site/draw/app.js').read_text(encoding='utf-8')
          admin = Path('site/admin/index.html').read_text(encoding='utf-8')
          admin_app = Path('site/admin/app.js').read_text(encoding='utf-8')
          api = Path('site/api.js').read_text(encoding='utf-8')
          ticket = Path('site/ticket.html').read_text(encoding='utf-8')
          ticket_app = Path('site/ticket.js').read_text(encoding='utf-8')
          verify = Path('site/verify.html').read_text(encoding='utf-8')
          workshop = Path('site/workshop/index.html').read_text(encoding='utf-8')
          workshop_app = Path('site/workshop/app.js').read_text(encoding='utf-8')
          root_404 = Path('404.html').read_text(encoding='utf-8')
          site_404 = Path('site/404.html').read_text(encoding='utf-8')

          assert 'THEARD — Attention Engine' in main, 'main entrance title missing'
          assert 'THEARD — 趨勢訊號分析器' in analyzer, 'trend analyzer entrance title missing'
          assert 'THEARD LIVE — PASS DRAW' in draw, 'draw entrance title missing'
          assert 'THEARD — Ticket Issuance Admin' in admin, 'admin entrance title missing'
          assert 'href="../"' in analyzer, 'trend analyzer must return to main site'
          assert 'href="../"' in draw, 'draw page must return to main site'
          assert 'href="../"' in admin, 'admin page must return to main site'
          assert '<a href="#activities"><span>//04</span><b>ACTIVITY</b>' in main, 'main activity navigation missing'
          assert '<a href="draw/"><span>//06</span><b>TICKET</b>' in main, 'main ticket navigation must open draw'
          assert 'id="activities"' in main and 'href="workshop/"' in main, 'main activity zone must link to Prompt Lab'

          # Each entrance owns its runtime and visual namespace.
          assert 'src="draw/app.js' not in main
          assert 'href="draw/styles.css' not in main
          assert 'src="../app.js' not in analyzer
          assert 'href="../styles.css' not in analyzer
          assert 'src="../app.js' not in draw
          assert 'href="../styles.css' not in draw
          assert 'src="../app.js' not in admin
          assert 'href="../styles.css' not in admin

          # Main trend teaser and dedicated analyzer share only public JSON data.
          assert "./trend.js" in main_app, 'main app must load trend teaser'
          assert 'href="trend/"' in trend_module, 'main trend teaser must link to analyzer'
          assert '../data/trend-article.json' in analyzer_app, 'analyzer must consume public trend payload'
          assert '../draw/app.js' not in analyzer and '../draw/styles.css' not in analyzer, 'analyzer must not load draw assets'
          assert 'matter.js' not in analyzer_app and 'pets.js' not in analyzer_app, 'analyzer runtime must remain isolated'

          # Main pass ticket syncs only through shared state, never by loading draw runtime/assets.
          assert "./pass-sync.js" in main_app, 'main app must load pass sync bridge'
          assert 'theard.passdraw.v3' in pass_sync, 'pass sync must consume draw state'
          assert "ticket.href='draw/'" in pass_sync, 'main live pass must open draw system'
          assert 'draw/app.js' not in pass_sync and 'draw/styles.css' not in pass_sync and 'pets.js' not in pass_sync, 'pass sync must not import draw assets'

          # Main activity zone reads only the whitelisted public session feed.
          assert 'api.js' in main and "./activity.js" in main_app, 'main must load the public activity sync'
          assert 'listPublicSessions' in api and 'listPublicSessions' in activity_app
          assert 'data-public-sessions-list' in main and 'data-public-session-template' in main
          assert 'innerHTML' not in activity_app, 'public activity data must use safe DOM rendering'

          # Draw remains isolated from all trend/main runtimes.
          assert 'trend.js' not in draw and 'trend.css' not in draw, 'draw page must not load trend UI'
          assert '../trend' not in draw_app and 'matter.js' not in draw_app, 'draw runtime must remain isolated'

          # Shared client exposes only the public/admin API contract; draw result is decided remotely.
          assert 'TheardAPI' in api and 'lookupDrawCode' in api and 'claimDrawCode' in api and 'verifyTicket' in api
          assert '../api.js' in draw and 'lookupDrawCode' in draw_app and 'claimDrawCode' in draw_app
          assert 'state.remaining' not in draw_app and 'EDIT POOL' not in draw, 'public draw must not own an editable ticket pool'

          # Admin is protected by runtime key and reads the shared server ledger.
          assert '../api.js' in admin, 'admin must load the shared API client'
          assert 'connectAdmin' in admin_app and 'getAdminState' in admin_app and 'issueSession' in admin_app
          assert 'updateSession' in admin_app and 'deleteSession' in admin_app, 'admin session edit/delete actions missing'
          assert 'sessionEditDialog' in admin and 'sessionDeleteDialog' in admin, 'admin session dialogs missing'
          assert "method:'DELETE'" in api, 'shared API client session delete method missing'
          assert 'localStorage' not in admin_app, 'admin localStorage must not be the ticket authority'
          assert 'matter.js' not in admin_app and 'pets.js' not in admin_app and 'trend.js' not in admin_app, 'admin runtime must remain isolated'
          assert 'draw/app.js' not in admin and 'trend/app.js' not in admin, 'admin page must not load public app runtimes'

          # Electronic ticket is read-only and verification is backed by the shared API.
          assert 'ticketForm' not in ticket and 'nameInput' not in ticket and 'makeId' not in ticket_app
          assert 'theard.passdraw.latest' in ticket_app and 'verify.html' in ticket_app and 'verifyToken' in ticket_app
          assert 'api.js' in verify and 'verifyTicket' in verify
          for state in ('VALID', 'USED', 'REVOKED', 'NOT FOUND'):
              assert state in verify, f'verify state missing: {state}'
          assert 'updateTicketStatus' not in verify, 'public verify page must remain read-only'
          assert '/theard/site/admin/' in root_404 and '/theard/admin/' in site_404, 'admin recovery routes missing'
          assert '/theard/site/workshop/' in root_404 and '/theard/workshop/' in site_404, 'Prompt Lab recovery routes missing'

          # Prompt Lab is a BYO-AI, local-first classroom tool with no model API or admin runtime.
          for marker in ('promptForm', 'timerPanel', 'lockAndShuffle', 'comparisonGrid', 'bingoGrid'):
              assert f'id="{marker}"' in workshop, f'Prompt Lab control missing: {marker}'
          assert 'DEVICE-LOCAL ONLY' in workshop and 'NO API / NO UPLOAD' in workshop
          assert '提示詞抽取器' in workshop, 'Prompt extractor label missing'
          assert 'localStorage' in workshop_app and 'fetch(' not in workshop_app
          assert '../api.js' not in workshop and '../admin/' not in workshop_app

          print('Isolation check passed: /, /trend/, /draw/, /admin/, /workshop/, and public sync bridges are independent.')
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
